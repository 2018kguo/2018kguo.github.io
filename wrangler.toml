name = "kguo-garden"
main = "worker/garden.js"
compatibility_date = "2025-10-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "kguo.dev/garden/api/*", zone_name = "kguo.dev" }]

[[durable_objects.bindings]]
name = "GARDEN"
class_name = "Garden"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Garden"]

[[ratelimits]]
name = "LOGIN_LIMIT"
namespace_id = "1001"
simple = { limit = 8, period = 60 }
